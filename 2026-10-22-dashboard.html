<script>
"use strict";

  const linesV = (s.lines || []).map(L => {             // clip a line that starts before the window
    let [a, b2] = L.pts;
    if (a[0] < XMIN && b2[0] > a[0]) a = [XMIN, a[1] + (b2[1] - a[1]) * (XMIN - a[0]) / (b2[0] - a[0])];
    return Object.assign({}, L, {pts: [a, b2]});
  });
  const dayList = (s.days || []).filter(d => d.x >= XMIN);
  if (!bars.length) {
    el("text", {x: pad.l + pw / 2, y: H / 2, "text-anchor": "middle", class: "empty"}, svg)
      .textContent = s.symbol ? "Waiting for today's first bars…" : "No stock picked yet.";
    return;
  }
  // another watched symbol on the chart: show its own trades and price, not the active one's
  const chartSym = s.chart_symbol || s.symbol, own = chartSym === s.symbol;
  const p = own ? s.pos : null;
  const trades = (s.trades || []).filter(t => (t.symbol || s.symbol) === chartSym);
  const wrow = (s.watch || []).find(w => w.symbol === chartSym);
  const lastPx = own ? s.last : (wrow ? wrow.last : null);
  // y domain: the day's range plus every level on screen
  let ys = [];
  bars.forEach(b => ys.push(b.l, b.h));
  linesV.forEach(L => L.pts.forEach(pt => ys.push(pt[1])));
  if (p) ys.push(p.entry, p.stop, p.init_stop);
  trades.forEach(t => ys.push(t.entry, t.exit));
  if (lastPx != null) ys.push(lastPx);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const span = Math.max(hi - lo, hi * 0.002);
  lo -= span * 0.06; hi += span * 0.06;
  const x = i => pad.l + (i - XMIN + 0.5) / TOTAL * pw;
  const xEdge = i => pad.l + (i - XMIN) / TOTAL * pw;          // bar boundary (day starts, clock times)
  const y = v => pad.t + (hi - v) / (hi - lo) * ph;

  // grid + y ticks (right side)
  const step = niceStep((hi - lo) / 5), ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    el("line", {x1: pad.l, x2: pad.l + pw, y1: y(v), y2: y(v), stroke: cssVar("--grid"), "stroke-width": 1}, svg);
    const t = el("text", {x: pad.l + pw + 6, y: y(v) + 4, "font-size": 11, fill: cssVar("--muted")}, svg);
    t.textContent = v.toFixed(step < 1 ? 2 : 0);
    ticks.push([y(v), t]);
  }
  // time axis: hourly labels
  el("line", {x1: pad.l, x2: pad.l + pw, y1: pad.t + ph, y2: pad.t + ph, stroke: cssVar("--axis")}, svg);
  let lastLab = -1e9;
  if (days === 1) {
    // labels by minutes after 9:30, converted to bar positions
    [[0, "9:30"], [30, "10:00"], [90, "11:00"], [150, "12:00"], [210, "1:00"], [270, "2:00"], [330, "3:00"], [390, "4:00"]].forEach(([m, lab]) => {
      const lx = xEdge(m / bm);
      if (lx - lastLab < 42 || (m === 330 && pad.l + pw - lx < 42)) return;     // keep labels from colliding
      lastLab = lx;
      const t = el("text", {x: lx, y: H - 8, "font-size": 11, fill: cssVar("--muted"), "text-anchor": m === 0 ? "start" : m === 390 ? "end" : "middle"}, svg);
      t.textContent = lab;
    });
  } else {
    // one label per session, plus a divider where each new day opens
    dayList.forEach(d => {
      const lx = xEdge(d.x), w = pw / days;
      if (d.x > XMIN) el("line", {x1: lx, x2: lx, y1: pad.t, y2: pad.t + ph, stroke: cssVar("--grid"), "stroke-width": 1, "stroke-dasharray": "2 3"}, svg);
      const t = el("text", {x: lx + w / 2, y: H - 8, "font-size": 11, fill: cssVar("--muted"), "text-anchor": "middle"}, svg);
      t.textContent = d.back === 0 ? "Today" : (w < 60 ? d.label.split(" ")[1] : d.label);
    });
  }
  // 15:50 sell-off marker (today)
  const xs = xEdge(380 / bm);                                  // 3:50 PM
  el("line", {x1: xs, x2: xs, y1: pad.t, y2: pad.t + ph, stroke: cssVar("--axis"), "stroke-width": 1}, svg);
  const st = el("text", {x: xs - 4, y: pad.t + 10, "font-size": 11, fill: cssVar("--muted"), "text-anchor": "end"}, svg);
  st.textContent = "3:50 sell-off";

  // risk / locked-gain wash between entry and stop
  if (p) {
    const x0 = x(p.entry_x) - (pw / TOTAL) / 2, x1 = pad.l + pw;
    const top = Math.max(p.entry, p.stop), bot = Math.min(p.entry, p.stop);
    el("rect", {x: x0, y: y(top), width: Math.max(0, x1 - x0), height: Math.max(1, y(bot) - y(top)),
                fill: p.stop > p.entry ? cssVar("--gain-wash") : cssVar("--risk-wash")}, svg);
  }

  // candles (neutral ink: price is context, the levels are the story)
  const cw = Math.max(1, pw / TOTAL * 0.6), ink = cssVar("--ink-2");
  bars.forEach(b => {
    const cx = x(b.x);
    el("line", {x1: cx, x2: cx, y1: y(b.h), y2: y(b.l), stroke: ink, "stroke-width": 1}, svg);
    const up = b.c >= b.o, yt = y(Math.max(b.o, b.c)), hgt = Math.max(1, Math.abs(y(b.o) - y(b.c)));
    el("rect", {x: cx - cw / 2, y: yt, width: cw, height: hgt, rx: 1,
                fill: up ? cssVar("--surface") : ink, stroke: ink, "stroke-width": 1}, svg);
  });

  // confirmed swing points
  swingsV.forEach(sw => {
    const off = sw.kind === "low" ? 7 : -7;
    el("circle", {cx: x(sw.x), cy: y(sw.y) + off, r: 2.5, fill: "none", stroke: cssVar("--muted"), "stroke-width": 1.2}, svg);
  });

  const labels = [];   // right-gutter direct labels: [y, text, color]
  // trend lines
  linesV.forEach(L => {
    const c = cssVar(L.kind === "support" ? "--support" : "--resist");
    const [a, b2] = L.pts;
    el("line", {x1: x(a[0]), y1: y(a[1]), x2: x(b2[0]), y2: y(b2[1]), stroke: c, "stroke-width": 2, "stroke-linecap": "round"}, svg);
    labels.push([y(b2[1]), `${L.kind === "support" ? "Support" : "Resist."} ${fmt(b2[1])}`, c]);
  });

  // closed trades: entry ▲ → exit ●, thin connector
  trades.forEach(t => {
    const c = t.pnl >= 0 ? cssVar("--good") : cssVar("--stop");
    el("line", {x1: x(t.entry_x), y1: y(t.entry), x2: x(t.exit_x), y2: y(t.exit), stroke: c, "stroke-width": 1.5, "stroke-dasharray": "3 3"}, svg);
    tri(svg, x(t.entry_x), y(t.entry), cssVar("--entry"));
    el("circle", {cx: x(t.exit_x), cy: y(t.exit), r: 4.5, fill: c, stroke: cssVar("--surface"), "stroke-width": 2}, svg);
  });

  // open position: entry, initial stop, trailing stop steps
  if (p) {
    const xe = x(p.entry_x), xr = pad.l + pw;
    el("line", {x1: xe, x2: xr, y1: y(p.init_stop), y2: y(p.init_stop), stroke: cssVar("--muted"), "stroke-width": 1, "stroke-dasharray": "4 3"}, svg);
    el("line", {x1: xe, x2: xr, y1: y(p.entry), y2: y(p.entry), stroke: cssVar("--entry"), "stroke-width": 1.5}, svg);
    let d = "", steps = p.stop_steps || [[p.entry_x, p.stop]];
    steps.forEach((st2, k) => {
      const sx = x(st2[0]), sy = y(st2[1]);
      if (k === 0) d += `M${sx},${sy}`; else d += `H${sx}V${sy}`;
    });
    d += `H${xr}`;
    el("path", {d, fill: "none", stroke: cssVar("--stop"), "stroke-width": 2}, svg);
    tri(svg, xe, y(p.entry), cssVar("--entry"));
    labels.push([y(p.entry), `Entry ${fmt(p.entry)}`, cssVar("--entry")]);
    labels.push([y(p.stop), `Stop ${fmt(p.stop)}`, cssVar("--stop")]);
    if (p.stop > p.init_stop) labels.push([y(p.init_stop), `Init ${fmt(p.init_stop)}`, cssVar("--muted")]);
  }
  if (lastPx != null) {
    const lb = bars[bars.length - 1];
    el("line", {x1: x(lb.x), x2: pad.l + pw, y1: y(lastPx), y2: y(lastPx), stroke: cssVar("--ink"), "stroke-width": 1, "stroke-dasharray": "1 3"}, svg);
    labels.push([y(lastPx), `Last ${fmt(lastPx)}`, cssVar("--ink")]);
  }
  placeLabels(svg, labels, pad.l + pw + 6, pad.t, pad.t + ph);
  // the direct labels win the gutter: drop any axis number they would overlap
  ticks.forEach(([ty, t]) => { if (labels.some(L => Math.abs(L[0] - ty) < 12)) t.remove(); });

  // hover: crosshair snapping to the nearest bar
  const cross = el("line", {y1: pad.t, y2: pad.t + ph, stroke: cssVar("--muted"), "stroke-width": 1, visibility: "hidden"}, svg);
  const hit = el("rect", {x: pad.l, y: pad.t, width: pw, height: ph, fill: "transparent"}, svg);
  const tip = $("tip");
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    const i = (px - pad.l) / pw * TOTAL + XMIN - 0.5;
    const b = bars.reduce((best, bb) => Math.abs(bb.x - i) < Math.abs(best.x - i) ? bb : best, bars[0]);
    cross.setAttribute("x1", x(b.x)); cross.setAttribute("x2", x(b.x)); cross.setAttribute("visibility", "visible");
    tip.replaceChildren();
    const dOf = dayList.filter(d => d.x <= b.x + 1e-9).pop();
    addRow(tip, (days > 1 && dOf ? (dOf.back === 0 ? "Today" : dOf.label) + " " : "") + b.t + " ET", "", null, true);
    addRow(tip, "Open", fmt(b.o)); addRow(tip, "High", fmt(b.h)); addRow(tip, "Low", fmt(b.l)); addRow(tip, "Close", fmt(b.c));
    linesV.forEach(L => {
      const [a, b2] = L.pts;
      if (b.x >= a[0] && b.x <= b2[0] && b2[0] !== a[0]) {
        const v = a[1] + (b2[1] - a[1]) * (b.x - a[0]) / (b2[0] - a[0]);
        addRow(tip, L.kind === "support" ? "Support" : "Resistance", fmt(v), cssVar(L.kind === "support" ? "--support" : "--resist"));
      }
    });
    if (p && b.x >= p.entry_x) {
      let sv = p.init_stop;
      (p.stop_steps || []).forEach(st2 => { if (st2[0] <= b.x) sv = st2[1]; });
      addRow(tip, "Stop", fmt(sv), cssVar("--stop"));
    }
    tip.style.display = "block";
    const wrap = $("chartwrap").getBoundingClientRect();
    let left = ev.clientX - wrap.left + 14;
    if (left + tip.offsetWidth > wrap.width) left = ev.clientX - wrap.left - tip.offsetWidth - 14;
    tip.style.left = left + "px";
    tip.style.top = Math.max(0, ev.clientY - wrap.top - 20) + "px";
  });
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
}
function tri(svg, cx, cy, color) {
  el("path", {d: `M${cx},${cy - 1} l-5,9 h10 z`, fill: color, stroke: cssVar("--surface"), "stroke-width": 1.5}, svg);
}
function addRow(tip, label, value, color, header) {
  const row = document.createElement("div"); row.className = "row";
  const l = document.createElement("span"); l.className = "lab";
  if (color) { const k = document.createElement("i"); k.className = "key"; k.style.borderColor = color; l.appendChild(k); }
  l.appendChild(document.createTextNode(label));
  if (header) l.style.fontWeight = "600";
  const v = document.createElement("b"); v.textContent = value;
  row.append(l, v); tip.appendChild(row);
}
function placeLabels(svg, labels, xLab, top, bottom) {
  labels.sort((a, b) => a[0] - b[0]);
  const gap = 14;
  for (let i = 0; i < labels.length; i++) {
    labels[i][0] = Math.max(labels[i][0], top + 6, i ? labels[i - 1][0] + gap : -1e9);
  }
  for (let i = labels.length - 1; i >= 0; i--) {
    labels[i][0] = Math.min(labels[i][0], bottom - 2, i < labels.length - 1 ? labels[i + 1][0] - gap : 1e9);
  }
  labels.forEach(([ly, text, color]) => {
    el("rect", {x: xLab - 6, y: ly - 1, width: 3, height: 3, fill: color}, svg);
    const t = el("text", {x: xLab, y: ly + 4, "font-size": 11, "font-weight": 600, fill: cssVar("--ink")}, svg);
    t.textContent = text;
  });
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}

// ------------------------------------------------------------------ bar-size dropdown
// Shown only on the PC running the bot (the server adds window.__CONTROL__ for allowed viewers).
// Changing it changes the bars the bot TRADES on, not just the chart. It cannot place or cancel orders.
const CTRL = SNAP ? null : (window.__CONTROL__ || null);
let tfBusy = false;
function renderBarPicker(s) {
  const bm = s.bar_minutes || 5, sel = $("tf"), sizes = s.bar_sizes || [bm];
  const can = CTRL && !s.final;
  $("barlabel").textContent = can ? "Bars:" : bm + "-min bars";
  sel.hidden = !can;
  if (!can) { $("tfnote").textContent = ""; return; }
  if (sel.options.length !== sizes.length) {
    sel.replaceChildren(...sizes.map(m => { const o = document.createElement("option"); o.value = m; o.textContent = m + " min"; return o; }));
  }
  if (!tfBusy && document.activeElement !== sel) sel.value = String(s.pending_bars || bm);
  if (!tfBusy) $("tfnote").textContent = s.pending_bars ? `switching to ${s.pending_bars} min…` : (s.rescan_pending ? "rescanning…" : "");
  const rb = $("rescan");
  rb.hidden = false;
  rb.disabled = !s.can_rescan || s.rescan_pending;
  rb.title = s.can_rescan ? "Rank the watchlist again using today's prices" : "Only when not in a trade";
}
async function control(path, body) {
  const key = new URLSearchParams(location.search).get("key");
  const r = await fetch(path + (key ? "?key=" + encodeURIComponent(key) : ""), {
    method: "POST", cache: "no-store",
    headers: {"Content-Type": "application/json", "X-Swingbot-Token": CTRL.token},
    body: JSON.stringify(body),
  });
  const res = await r.json().catch(() => ({}));
  return [r.ok, res.message || (r.ok ? "" : "refused")];
}
$("rescan").addEventListener("click", async () => {
  if (!confirm("Rescan the watchlist using today's prices?\n\nThe bot then watches the new best setups. It only does this when not in a trade.")) return;
  tfBusy = true; $("rescan").disabled = true; $("tfnote").textContent = "sending…";
  try { $("tfnote").textContent = (await control("rescan", {}))[1]; }
  catch (e) { $("tfnote").textContent = "couldn't reach the bot"; }
  finally { tfBusy = false; }
});

// ------------------------------------------------------------------ which watched symbol is charted (this browser only)
let CHART = "";
try { CHART = localStorage.getItem("swingbot.chart") || ""; } catch (e) {}
function renderChartPicker(s) {
  const syms = (s.watch || []).map(w => w.symbol), sel = $("chartsel");
  $("chartpick").hidden = syms.length < 2;
  if (syms.length < 2) return;
  if (sel.options.length !== syms.length || [...sel.options].some((o, i) => o.value !== syms[i])) {
    sel.replaceChildren(...syms.map(m => { const o = document.createElement("option"); o.value = m;
      o.textContent = m + (m === s.symbol ? (s.pos ? " (in trade)" : " (active)") : ""); return o; }));
  }
  if (document.activeElement !== sel) sel.value = s.chart_symbol || s.symbol;
}
function chooseChart(sym) {
  CHART = sym && S && sym !== S.symbol ? sym : "";
  try { localStorage.setItem("swingbot.chart", CHART); } catch (e) {}
  poll();
}
$("chartsel").addEventListener("change", ev => chooseChart(ev.target.value));
$("tf").addEventListener("change", async ev => {
  const sel = ev.target, want = Number(sel.value), cur = S ? S.bar_minutes : null;
  if (S && S.pos && !confirm(`Switch the bot to ${want}-minute bars?\n\nThe open position and its stop stay as they are; the stop keeps trailing on ${want}-minute swing lows.`)) {
    sel.value = String(S.pending_bars || cur); return;
  }
  tfBusy = true; sel.disabled = true; $("tfnote").textContent = "sending…";
  try {
    const [ok, msg] = await control("bar-size", {minutes: want});
    $("tfnote").textContent = msg;
    if (!ok && cur) sel.value = String(cur);
  } catch (e) {
    $("tfnote").textContent = "couldn't reach the bot";
    if (cur) sel.value = String(cur);
  } finally { tfBusy = false; sel.disabled = false; }
});

// ------------------------------------------------------------------ tables
function table(container, cols, rows, empty) {
  container.replaceChildren();
  if (!rows.length) { const d = document.createElement("div"); d.className = "none"; d.textContent = empty; container.appendChild(d); return; }
  const t = document.createElement("table"), tr = document.createElement("tr");
  cols.forEach(c => { const th = document.createElement("th"); th.textContent = c.h; if (c.num) th.className = "num"; tr.appendChild(th); });
  const thead = document.createElement("thead"); thead.appendChild(tr); t.appendChild(thead);
  const tb = document.createElement("tbody");
  rows.forEach(r => {
    const row = document.createElement("tr");
    cols.forEach(c => {
      const td = document.createElement("td"); if (c.num) td.className = "num";
      const v = c.f(r); td.textContent = v;
      if (c.tone) { const tc = tone(c.tone(r)); if (tc) td.classList.add(tc); }
      row.appendChild(td);
    });
    tb.appendChild(row);
  });
  t.appendChild(tb);
  const wrap = document.createElement("div"); wrap.style.overflowX = "auto"; wrap.appendChild(t);
  container.appendChild(wrap);
}
function renderTables(s) {
  table($("trades"), [
    {h: "Symbol", f: r => r.symbol || s.symbol}, {h: "In", f: r => r.entry_time}, {h: "Out", f: r => r.exit_time}, {h: "Type", f: r => r.kind},
    {h: "Shares", num: 1, f: r => r.shares}, {h: "Entry", num: 1, f: r => fmt(r.entry)}, {h: "Exit", num: 1, f: r => fmt(r.exit)},
    {h: "Exit by", f: r => r.reason}, {h: "P&L", num: 1, f: r => signed(r.pnl), tone: r => r.pnl},
  ], s.trades || [], "No completed trades yet.");
  renderWatch(s);
  table($("scan"), [
    {h: "Symbol", f: r => r.symbol}, {h: "Score", num: 1, f: r => fmt(r.score)}, {h: "Setup", f: r => r.setup}, {h: "Detail", f: r => r.detail},
  ], s.scan || [], "Scan runs at 9:35 ET.");
  const log = $("log"); log.replaceChildren();
  (s.events || []).forEach(e => {
    const d = document.createElement("div"); d.className = e.level;
    const t = document.createElement("span"); t.className = "t"; t.textContent = e.t + "  ";
    d.append(t, document.createTextNode(e.msg)); log.appendChild(d);
  });
  if (!log.childNodes.length) { const d = document.createElement("div"); d.className = "none"; d.textContent = "Nothing yet."; log.appendChild(d); }
}

function renderWatch(s) {
  const rows = s.watch || [];
  $("watch-h").textContent = rows.length > 1 ? `Watching ${rows.length} for entries – the first to signal is traded` : "Watching";
  table($("watch"), [
    {h: "Symbol", f: r => r.symbol}, {h: "Rank", num: 1, f: r => r.score == null ? "–" : fmt(r.score)},
    {h: "Morning setup", f: r => r.setup || "–"}, {h: "Last", num: 1, f: r => fmt(r.last)},
    {h: "Now", f: r => r.note || "–"},
    {h: "", f: r => r.in_trade ? "in trade" : (r.symbol === (s.chart_symbol || s.symbol) ? "on chart" : "")},
  ], rows, "Nothing watched yet.");
  const trs = $("watch").querySelectorAll("tbody tr");
  trs.forEach((tr, i) => {
    const r = rows[i]; if (!r) return;
    if (rows.length > 1) { tr.classList.add("pick"); tr.title = "Show " + r.symbol + " on the chart"; tr.onclick = () => chooseChart(r.symbol); }
    if (r.symbol === (s.chart_symbol || s.symbol)) tr.classList.add("on");
  });
}

// ------------------------------------------------------------------ freshness
function renderBanner(s) {
  const b = $("banner"); let msg = "", info = false;
  if (SNAP) { msg = `End-of-day snapshot from ${s.date || ""} – not live.`; info = true; }
  else if (failing) msg = "Can't reach the bot – it may have stopped. Showing the last data received.";
  else if (s.epoch && !s.final && Date.now() / 1000 - s.epoch > 120)
    msg = `No update from the bot for ${Math.round((Date.now() / 1000 - s.epoch) / 60)} min – check that it's still running.`;
  else if (s.final) { msg = "Session finished."; info = true; }
  else if (s.stale) {
    msg = `No new ${s.stale.symbol} bar since ${s.stale.since} ET (${s.stale.minutes} min): ${s.stale.feed} has had no trades in it, ` +
          `so the price and chart here are out of date` +
          (s.stale.in_trade ? ". The broker's stop is still active; check the real price in your broker's app." : ".");
  }
  b.textContent = msg; b.className = "banner" + (msg ? " show" : "") + (info ? " info" : "");
}

function render(s) { S = s; renderTop(s); renderChart(s); renderTables(s); renderBanner(s); }

async function poll() {
  try {
    const q = new URLSearchParams();
    const key = new URLSearchParams(location.search).get("key");
    if (key) q.set("key", key);
    if (CHART) q.set("chart", CHART);
    const r = await fetch("status.json" + (q.toString() ? "?" + q : ""), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    failing = false; lastOk = Date.now();
    render(s);
  } catch (e) {
    failing = true; if (S) renderBanner(S);
  }
}
$("days").value = String(VIEW_DAYS);
$("days").addEventListener("change", ev => {
  VIEW_DAYS = Number(ev.target.value) || 1;
  try { localStorage.setItem("swingbot.days", String(VIEW_DAYS)); } catch (e) {}
  if (S) renderChart(S);
});
if (SNAP) render(SNAP);
else { poll(); setInterval(poll, 3000); }
window.addEventListener("resize", () => S && renderChart(S));
</script>
</body>
