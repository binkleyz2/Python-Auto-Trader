# Example settings. The bot reads config.yaml, not this file: on the first run it copies this file to
# config.yaml. Edit config.yaml; updates from GitHub never change it. When an update adds a setting, it
# appears here and in CHANGELOG.md, and the log lists it at startup; copy it into config.yaml to change it.
# Anything left out of config.yaml uses the default in swingbot/config.py.

# Broker: "public" or "alpaca"
broker: alpaca
alpaca_paper: true          # alpaca only: true = paper account (fake money), false = REAL money
alpaca_feed: iex            # alpaca only: "iex" (free data plan) or "sip" (paid full-market data)
price_data: public          # alpaca only: "public" = prices from Public.com (needs Public keys in .env), "broker" = Alpaca's feed

#watchlist: [CCC, INTC, NVDA, CRWV, SPCX, OPEN, IREN, NOK, AAPL, SOFI, VRNS, WULF, PLUG, F, BAC, GRAB, BBD, SMCI, CIFR, T, NFLX, NU, AAL, RIG, FRO, DHT, STNG, INSW]
# S&P 100 as of the Sept 21, 2026 rebalance (GOOG left out; GOOGL covers Alphabet)
#watchlist: [AAPL, ABBV, ABT, ACN, ADBE, AMAT, AMD, AMGN, AMT, AMZN,
#            ANET, AVGO, AXP, BA, BAC, BKNG, BLK, BMY, BNY, BRK.B,
#            C, CAT, CMCSA, COF, COP, COST, CRM, CSCO, CVS, CVX,
#            DE, DELL, DHR, DIS, DUK, EMR, FDX, GD, GE, GEV,
#            GILD, GM, GOOGL, GS, HD, IBM, INTC, INTU, ISRG, JNJ,
#            JPM, KO, LIN, LLY, LMT, LOW, LRCX, MA, MCD, MDLZ,
#            MDT, META, MMM, MO, MRK, MS, MSFT, MU, NEE, NFLX,
#            NOW, NVDA, ORCL, PANW, PEP, PFE, PG, PLTR, PM, QCOM,
#            RTX, SBUX, SCHW, SNDK, SO, T, TMO, TMUS, TSLA, TXN,
#            UBER, UNH, UNP, UPS, USB, V, VZ, WFC, WMT, XOM]
watchlist_file: watchlist_russell2000.yaml
# Also scan whole indexes, downloaded fresh each morning and combined with the list above (each stock once;
# only stocks your broker can trade). Choose any of: sp500, dow, nasdaq100, nasdaq, russell2000.
# All five: about 4,500 stocks, roughly 10 minutes with Public's price data - start the bot by 9:15.
watchlist_indexes: []        # e.g. [sp500, dow, nasdaq100, nasdaq, russell2000]
min_price: 10
min_avg_dollar_volume: 10000000
watch_count: 5
# One stock per company: if two share classes make the list (GOOG and GOOGL, BRK.A and BRK.B), only the
# better-ranked one is watched and the next stock fills the place. Add pairs it doesn't know here:
same_company: []           # e.g. [[ABC, ABCD]]
scan_workers: 15
public_rate_limit: 8         # Public price data: at most 8 requests per second (it refuses bursts)
bar_minutes: 5               # Public's price data: 5, 10, 15 or 30 (no 1-3 minute history)

# Which strategy to trade:
#   trendline     swing-point trend lines on the stocks the morning scan picks (everything else in this file)
#   spy_momentum  SPY only: in when it leaves its usual range from the open, out back inside it or across
#                 VWAP, checked every 30 minutes; closed by flatten_time. See "SPY intraday momentum" in
#                 README.md. Backtest it first: py -m swingbot backtest --days 2500
strategy: trendline
momentum_symbol: SPY
momentum_lookback_days: 14     # days for the usual move from the open (the band) and the volatility
momentum_band_mult: 1.0        # band width, in usual moves
momentum_check_minutes: 30     # 10:00, 10:30, ... (5, 10, 15, 30 or 60)
momentum_first_check: "10:00"
momentum_vwap_stop: true       # exit back inside the band or across VWAP (false: only at the other band)
momentum_vol_target_pct: 2.0   # size the position for this much daily movement...
momentum_max_leverage: 1.0     # ...but at most this times the account (1 = no margin; the study used up to 4)

# Swing points: 5 bars on each side, on 5-minute bars
swing_n: 5
touch_tolerance_atr: 0.25
break_tolerance_atr: 0.10
breakout_volume_mult: 1.2

# Long: bounces off rising support, breakouts through falling resistance.
# Short: bounces off falling resistance, breakdowns through rising support.
direction: long             # long, short or both. Shorts need a margin account (at least $2,000) and
                            # stocks that can be borrowed; the same rules apply, mirrored.
enable_bounce: true
enable_breakout: true
# Trade only in the direction of the daily trend: long when it's up, short when it's down. The trend is up
# when yesterday's close is above its average close of the last trend_days days, down when below.
#   off     no filter (every signal is traded)
#   stock   the stock's own trend
#   market  the market's trend (trend_market_symbol, SPY = the S&P 500)
#   both    the stock and the market must agree (when they don't, that stock isn't traded that day)
# Compare them first: py -m swingbot backtest --days 180 --try trend_filter=off,stock,market,both
trend_filter: off
trend_days: 20
trend_market_symbol: SPY
stop_buffer_atr: 0.25
min_stop_atr: 0.5
max_stop_atr: 3.0
min_stop_pct: 0.25   # stop at least this % below the price; 0 = off

# Exits: the stop trails up under each new confirmed swing low; no fixed profit target
trail_stop: true
trail_buffer_atr:              # trailing stop this far under each swing low, in ATR (blank = stop_buffer_atr)
trail_min_step_atr: 0.1        # ignore stop raises smaller than this (fewer order changes)
auto_stop_after_manual: false  # after you move the stop with "Move" on the dashboard: false = the bot leaves it
                               # to you; true = breakeven and trailing keep tightening it (up for a long, down for
                               # a short). The Move form has a tick box to choose each time; this is its default.
breakeven_at_r: 1.0            # once price is 1R above entry, stop moves up to the entry price (0 = off)
use_target: false              # true = also take profit at reward_risk x the risk
reward_risk: 2.0

# Times are Eastern
first_entry_time: "09:45"
last_entry_time: "15:30"
flatten_time: "15:50"
midday_rescan_time: "12:45"   # rescan with today's bars ("" = off); in a trade it waits for the trade to close
midday_rescan_by: "15:00"     # ...but only if that is before this time
max_trades_per_day: 4

# Risk
risk_per_trade_pct: 0.5
max_position_pct: 25
daily_loss_limit_pct: 1.5
use_margin: false
settled_cash_only: true        # only spend cash that was already settled; today's sale proceeds are never reused
buying_power_buffer_pct: 2.0   # live orders never use more than 98% of current cash buying power

# Live dashboard: http://127.0.0.1:8765 while `run` is going
dashboard: true
dashboard_port: 8765
dashboard_open_browser: true
dashboard_lan: true        # true = phones/PCs on your home network can view it (needs the key)
dashboard_key:            # set your own key to bookmark the address; blank = new random key each run
dashboard_jpg: true        # also save a picture of the end-of-day page: logs/<date>-dashboard.jpg
results_spreadsheet: true  # daily/weekly results in logs/results-<account>.xlsx, updated after each session

# End-of-day report by email: results, every trade and a chart per traded symbol.
# The mail login goes in .env (SMTP_USER, SMTP_PASSWORD), never here. With Gmail, SMTP_PASSWORD is an
# "app password" (Google account > Security > 2-Step Verification > App passwords).
email_report: false
email_to:                   # e.g. you@example.com (several: separate with commas)
smtp_host: smtp.gmail.com
smtp_port: 587

# Always-on mode (py -m swingbot daemon - what the Docker image runs): start each market day's session at
daemon_start_time: "08:00"   # ET

# Alerts: a push to your phone and/or an email when something goes wrong - an order the bot couldn't
# confirm, a refused entry, the day report not sent, and (from the results website, if it's running) the bot
# not started by 9:31 ET or stopped responding. Test with: py -m swingbot.notify
# Phone: install the free "ntfy" app, subscribe to a topic, and put the same name here. Anyone who knows the
# name can read it, so make it long and random (e.g. swingbot-7f3k9q2x8m). A login token goes in .env: NTFY_TOKEN
ntfy_topic:
alert_email: false         # true = alerts by email too (to email_to)
notify_trades: false       # true = also a phone push for each entry and exit
update_check: true         # the dashboard says when a newer swingbot is out

# Results website: py -m swingbot site  (always on with: py -m swingbot site --install)
# Every trading day's results, the trades, the day reports and backtest zips - separate from the dashboard.
# https needs site_cert: one PEM file holding the certificate and its private key (e.g. a wildcard
# certificate for your domain; open it as https://<name>.<your domain>:4334 so the name matches).
site_port: 4334
site_cert:                 # e.g. C:\Users\you\certs\both.pem   (blank = http, this PC only)
site_lan: true             # true = other devices can view it (needs site_cert, and site_key or dashboard_key)
site_key:                  # access key (blank = same as dashboard_key); a private key password goes in .env: SITE_CERT_PASSWORD
site_http_lan: false       # true = no site_cert but still on the network over plain http (key needed) -
                           # for Docker behind your own https proxy; never straight onto the internet

# Backtest
starting_equity: 25000
slippage_pct: 0.02
backtest_results_dir: backtests/Results  # each run's files are zipped and moved here (blank = leave them loose in backtests/)
