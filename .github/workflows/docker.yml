# Builds the swingbot Docker image (amd64 and arm64) and pushes it to a DigitalOcean Container Registry and/or
# Docker Hub (each one only if it's set up below):
#  - after each release (the Release workflow), tagged with the version and "latest"
#  - by hand: Actions > Docker image > Run workflow
# A change to the Docker files alone only builds it, as a check, without pushing.
#
# Set up once, in the repo's Settings > Secrets and variables > Actions:
#   DigitalOcean:  secret DIGITALOCEAN_ACCESS_TOKEN (API token, registry read+write)
#                  variable DOCR_REPOSITORY  <your-registry>/swingbot   (e.g. zelwyn/swingbot)
#   Docker Hub:    secret DOCKERHUB_TOKEN (a Docker Hub access token, Read & Write)
#                  variable DOCKERHUB_REPOSITORY  <your Docker Hub user>/swingbot   (e.g. binkleyz2/swingbot)
# With neither, the image is still built (as a check) but not pushed anywhere.
name: Docker image

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, "docker/**", requirements.txt, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      REPO: ${{ vars.DOCR_REPOSITORY }}
      HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      HUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Version and whether to push
        id: v
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('swingbot/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # a pasted value often carries a line break or spaces: take them out (and a pasted registry prefix)
          REPO=$(printf '%s' "$REPO" | tr -d '[:space:]' | sed -e 's#^registry\.digitalocean\.com/##' -e 's#/*$##')
          DO_TOKEN=$(printf '%s' "$DO_TOKEN" | tr -d '[:space:]')
          case "$REPO" in
            ""|*/*) ;;
            *) echo "::warning::DOCR_REPOSITORY is '$REPO' - it should be <registry>/<image>, e.g. $REPO/swingbot"; REPO="$REPO/swingbot" ;;
          esac
          HUB_REPO=$(printf '%s' "$HUB_REPO" | tr -d '[:space:]' | sed -e 's#^docker\.io/##' -e 's#/*$##')
          HUB_TOKEN=$(printf '%s' "$HUB_TOKEN" | tr -d '[:space:]')
          case "$HUB_REPO" in
            */*|"") ;;
            *) echo "::warning::DOCKERHUB_REPOSITORY is '$HUB_REPO' - it should be <user>/<image>, e.g. $HUB_REPO/swingbot"; HUB_REPO="$HUB_REPO/swingbot" ;;
          esac
          tags=""; do_on=false; hub_on=false
          if [ "${{ github.event_name }}" != "push" ]; then
            if [ -n "$DO_TOKEN" ] && [ -n "$REPO" ]; then
              do_on=true; tags="registry.digitalocean.com/$REPO:v$v,registry.digitalocean.com/$REPO:latest"
            fi
            if [ -n "$HUB_TOKEN" ] && [ -n "$HUB_REPO" ]; then
              hub_on=true; tags="${tags:+$tags,}docker.io/$HUB_REPO:v$v,docker.io/$HUB_REPO:latest"
            fi
          fi
          echo "do=$do_on" >> "$GITHUB_OUTPUT"
          echo "hub=$hub_on" >> "$GITHUB_OUTPUT"
          echo "hub_user=${HUB_REPO%%/*}" >> "$GITHUB_OUTPUT"
          if [ -n "$tags" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=$tags" >> "$GITHUB_OUTPUT"
            echo "Pushing: $tags"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=swingbot:v$v" >> "$GITHUB_OUTPUT"
            echo "Build only (no push): needs a registry set up (see the top of this file), and a release or a manual run"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the DigitalOcean registry
        if: steps.v.outputs.do == 'true'
        run: |
          t=$(printf '%s' "$DO_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$t"
          printf '%s' "$t" | docker login registry.digitalocean.com --username "$t" --password-stdin

      - name: Log in to Docker Hub
        if: steps.v.outputs.hub == 'true'
        run: |
          t=$(printf '%s' "$HUB_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$t"
          printf '%s' "$t" | docker login docker.io --username "${{ steps.v.outputs.hub_user }}" --password-stdin

      - name: Build${{ steps.v.outputs.push == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.push == 'true' }}
          tags: ${{ steps.v.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}

      - name: Check the image starts
        if: steps.v.outputs.push != 'true'
        run: |
          docker buildx build --load -t swingbot:check --build-arg VERSION=${{ steps.v.outputs.version }} .
          mkdir -p data
          docker run --rm -v "$PWD/data:/data" swingbot:check setup
          test -f data/config.yaml && test -f data/.env
          # Public.com only: broker fixed, no Alpaca or NinjaTrader settings, keys, code or library
          grep -q "^broker: public" data/config.yaml
          if grep -qiE "^(alpaca|ninja|price_data)" data/config.yaml; then echo "config has other brokers"; exit 1; fi
          if grep -qiE "alpaca|ninja" data/.env; then echo ".env has other brokers' keys"; exit 1; fi
          if docker run --rm --entrypoint python swingbot:check -c "import alpaca" 2>/dev/null; then
            echo "the Alpaca library is in the image"; exit 1; fi
          docker run --rm --entrypoint sh swingbot:check -c "test ! -e /app/swingbot/alpaca_live.py && test ! -e /app/swingbot/ninja_live.py"
          docker run --rm -v "$PWD/data:/data" swingbot:check download --days 5 2>&1 | grep -q "Public.com-only"
          docker run --rm -v "$PWD/data:/data" swingbot:check backtest --help | head -3
          docker run --rm -v "$PWD/data:/data" swingbot:check demo | tail -3
