# Builds the swingbot Docker image (amd64 and arm64) and pushes it to a DigitalOcean Container Registry and/or
# Docker Hub (each one only if it's set up below):
#  - after each release (the Release workflow), tagged with the version and "latest"
#  - by hand: Actions > Docker image > Run workflow
# A change to the Docker files alone only builds it, as a check, without pushing.
#
# Set up once, in the repo's Settings > Secrets and variables > Actions:
#   DigitalOcean:  secret DIGITALOCEAN_ACCESS_TOKEN (API token: registry read, update and delete - each run
#                  deletes all but the previous version there and runs garbage collection, to stay in the quota)
#                  variable DOCR_REPOSITORY  <your-registry>/swingbot   (e.g. zelwyn/swingbot)
#   Docker Hub:    secret DOCKERHUB_TOKEN (a Docker Hub access token, Read & Write)
#                  variable DOCKERHUB_REPOSITORY  <your Docker Hub user>/swingbot   (e.g. binkleyz/swingbot)
# With neither, the image is still built (as a check) but not pushed anywhere.
# With Docker Hub set up, each run also lists the image's fixable vulnerabilities (Docker Scout, the same scan
# Docker Hub shows), in the run's summary.
name: Docker image

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, "docker/**", requirements.txt, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      REPO: ${{ vars.DOCR_REPOSITORY }}
      HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      HUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Version and whether to push
        id: v
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('swingbot/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # a pasted value often carries a line break or spaces: take them out (and a pasted registry prefix)
          REPO=$(printf '%s' "$REPO" | tr -d '[:space:]' | sed -e 's#^registry\.digitalocean\.com/##' -e 's#/*$##')
          DO_TOKEN=$(printf '%s' "$DO_TOKEN" | tr -d '[:space:]')
          case "$REPO" in
            ""|*/*) ;;
            *) echo "::warning::DOCR_REPOSITORY is '$REPO' - it should be <registry>/<image>, e.g. $REPO/swingbot"; REPO="$REPO/swingbot" ;;
          esac
          HUB_REPO=$(printf '%s' "$HUB_REPO" | tr -d '[:space:]' | sed -e 's#^docker\.io/##' -e 's#/*$##')
          HUB_TOKEN=$(printf '%s' "$HUB_TOKEN" | tr -d '[:space:]')
          case "$HUB_REPO" in
            */*|"") ;;
            *) echo "::warning::DOCKERHUB_REPOSITORY is '$HUB_REPO' - it should be <user>/<image>, e.g. $HUB_REPO/swingbot"; HUB_REPO="$HUB_REPO/swingbot" ;;
          esac
          # The image is built and pushed to one registry (Docker Hub if it's set up), then copied to the other,
          # so a problem with one (a full registry, say) doesn't stop the other getting it.
          tags=""; do_on=false; hub_on=false; copy=false
          if [ "${{ github.event_name }}" != "push" ]; then
            [ -n "$DO_TOKEN" ] && [ -n "$REPO" ] && do_on=true
            [ -n "$HUB_TOKEN" ] && [ -n "$HUB_REPO" ] && hub_on=true
            if $hub_on; then
              tags="docker.io/$HUB_REPO:v$v,docker.io/$HUB_REPO:latest"
              $do_on && copy=true
            elif $do_on; then
              tags="registry.digitalocean.com/$REPO:v$v,registry.digitalocean.com/$REPO:latest"
            fi
          fi
          echo "do=$do_on" >> "$GITHUB_OUTPUT"
          echo "hub=$hub_on" >> "$GITHUB_OUTPUT"
          echo "copy_to_do=$copy" >> "$GITHUB_OUTPUT"
          echo "do_repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "hub_user=${HUB_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "hub_repo=$HUB_REPO" >> "$GITHUB_OUTPUT"
          if [ -n "$HUB_TOKEN" ] && [ -n "$HUB_REPO" ]; then echo "scan=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$tags" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=$tags" >> "$GITHUB_OUTPUT"
            echo "Pushing: $tags"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=swingbot:v$v" >> "$GITHUB_OUTPUT"
            echo "Build only (no push): needs a registry set up (see the top of this file), and a release or a manual run"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the DigitalOcean registry
        if: steps.v.outputs.do == 'true'
        run: |
          t=$(printf '%s' "$DO_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$t"
          printf '%s' "$t" | docker login registry.digitalocean.com --username "$t" --password-stdin

      - name: Log in to Docker Hub
        if: steps.v.outputs.scan == 'true'
        run: |
          t=$(printf '%s' "$HUB_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$t"
          printf '%s' "$t" | docker login docker.io --username "${{ steps.v.outputs.hub_user }}" --password-stdin
          echo "HUB_PAT=$t" >> "$GITHUB_ENV"            # the trimmed token, for the scans below (masked)

      # Docker Hub with immutable tags won't take a version twice: when it already has this one (a run started
      # again to finish the copy to DigitalOcean, say), it isn't built and pushed again.
      - name: Already on Docker Hub?
        id: have
        if: steps.v.outputs.hub == 'true'
        run: |
          if docker buildx imagetools inspect "docker.io/${{ steps.v.outputs.hub_repo }}:v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "Docker Hub already has v${{ steps.v.outputs.version }}: not pushing it again"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build${{ steps.v.outputs.push == 'true' && ' and push' || '' }}
        if: steps.have.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.push == 'true' }}
          tags: ${{ steps.v.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}

      - name: Point Docker Hub's latest at this version
        if: steps.have.outputs.skip == 'true'
        run: |
          hub=docker.io/${{ steps.v.outputs.hub_repo }}
          want=$(docker buildx imagetools inspect "$hub:v${{ steps.v.outputs.version }}" --format '{{json .Manifest.Digest}}')
          have=$(docker buildx imagetools inspect "$hub:latest" --format '{{json .Manifest.Digest}}' 2>/dev/null || true)
          if [ "$want" = "$have" ]; then echo "latest is already v${{ steps.v.outputs.version }}"; exit 0; fi
          if ! docker buildx imagetools create -t "$hub:latest" "$hub:v${{ steps.v.outputs.version }}"; then
            echo "::error::Docker Hub wouldn't move latest. If it mentions immutability, limit immutable tags to the version tags (a rule like v.*) in the repository's settings on Docker Hub, then run this again."
            exit 1
          fi

      - name: Copy to the DigitalOcean registry
        if: steps.v.outputs.copy_to_do == 'true'
        run: |
          # the free registry holds only a few versions: first delete all but the previous one and free the space
          DO_TOKEN=$(printf '%s' "$DO_TOKEN" | tr -d '[:space:]') python3 docker/do_cleanup.py \
            "${{ steps.v.outputs.do_repo }}" "${{ steps.v.outputs.version }}" 1
          src=docker.io/${{ steps.v.outputs.hub_repo }}:v${{ steps.v.outputs.version }}
          dst=registry.digitalocean.com/${{ steps.v.outputs.do_repo }}
          if ! docker buildx imagetools create -t "$dst:v${{ steps.v.outputs.version }}" -t "$dst:latest" "$src"; then
            echo "::error::Couldn't copy the image to $dst. If it says 'quota exceeded', the registry is full: in DigitalOcean, Container Registry, delete old tags or move to a bigger plan, then run this workflow again (Docker Hub already has this version)."
            exit 1
          fi

      - name: Check the image starts
        if: steps.v.outputs.push != 'true'
        run: |
          docker buildx build --load -t swingbot:check --build-arg VERSION=${{ steps.v.outputs.version }} .
          mkdir -p data
          docker run --rm -v "$PWD/data:/data" swingbot:check setup
          test -f data/config.yaml && test -f data/.env
          # Public.com only: broker fixed, no Alpaca or NinjaTrader settings, keys, code or library
          grep -q "^broker: public" data/config.yaml
          if grep -qiE "^(alpaca|ninja|price_data)" data/config.yaml; then echo "config has other brokers"; exit 1; fi
          if grep -qiE "alpaca|ninja" data/.env; then echo ".env has other brokers' keys"; exit 1; fi
          if docker run --rm --entrypoint python swingbot:check -c "import alpaca" 2>/dev/null; then
            echo "the Alpaca library is in the image"; exit 1; fi
          docker run --rm --entrypoint sh swingbot:check -c "test ! -e /app/swingbot/alpaca_live.py && test ! -e /app/swingbot/ninja_live.py"
          docker run --rm -v "$PWD/data:/data" swingbot:check download --days 5 2>&1 | grep -q "Public.com-only"
          docker run --rm -v "$PWD/data:/data" swingbot:check backtest --help | head -3
          docker run --rm -v "$PWD/data:/data" swingbot:check demo | tail -3

      # Vulnerabilities with a fix available. A build-only run scans the image it just built, and the one
      # published now for comparison; a publishing run scans what it pushed.
      - name: Vulnerabilities in this build
        if: steps.v.outputs.scan == 'true'
        uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de   # v1.18.2
        with:
          command: cves
          image: ${{ steps.v.outputs.push == 'true' && format('registry://docker.io/{0}:v{1}', steps.v.outputs.hub_repo, steps.v.outputs.version) || 'local://swingbot:check' }}
          only-fixed: true
          dockerhub-user: ${{ steps.v.outputs.hub_user }}
          dockerhub-password: ${{ env.HUB_PAT }}
          write-comment: false

      - name: Vulnerabilities in the published image
        if: steps.v.outputs.scan == 'true' && steps.v.outputs.push != 'true'
        continue-on-error: true
        uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de   # v1.18.2
        with:
          command: cves
          image: registry://docker.io/${{ steps.v.outputs.hub_repo }}:latest
          only-fixed: true
          dockerhub-user: ${{ steps.v.outputs.hub_user }}
          dockerhub-password: ${{ env.HUB_PAT }}
          write-comment: false
